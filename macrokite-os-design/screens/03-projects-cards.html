<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0e}
a{color:#3fe0b5}a:hover{color:#8af0d3}
</style>
</helmet>
<div style="min-height: 100vh; background: #0b0c0e; color: #e7e8ea; font-family: Geist, system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 260px; box-sizing: border-box; padding: 20px 14px; border-right: 1px solid #1f2226; display: flex; flex-direction: column; gap: 4px; background: #0e1012">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px">
<div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #3fe0b5; display: flex; align-items: center; justify-content: center; color: #3fe0b5; font-weight: 600; font-size: 13px">M</div>
<div style="font-weight: 600; font-size: 15px">Macrokite</div>
</div>
<a href="#" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">Overview</a>
<a href="#" aria-current="page" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #f2f3f5; text-decoration: none; background: #1a1d21">Projects<span style="font-size: 11px; font-weight: 600; background: #3fe0b5; color: #062a20; border-radius: 10px; padding: 1px 7px">3</span></a>
<a href="Meetings.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">Meetings</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">My tasks<span style="font-size: 11px; color: #8a8f98">6</span></a>
<div style="height: 1px; background: #1f2226; margin: 10px 4px"></div>
<a href="General.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none"># General<span style="font-size: 11px; font-weight: 600; background: #3fe0b5; color: #062a20; border-radius: 10px; padding: 1px 7px">5</span></a>
<a href="Messages.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">Messages<span style="font-size: 11px; font-weight: 600; background: #3fe0b5; color: #062a20; border-radius: 10px; padding: 1px 7px">1</span></a>
<div style="height: 1px; background: #1f2226; margin: 10px 4px"></div>
<a href="Team.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">Team</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #a7abb3; text-decoration: none">Settings</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 48px 32px 64px">
<div style="max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Projects</h1>
<p style="margin: 0; color: #8a8f98">8 active · 1 on hold · <span style="color: #ff8f7a">1 past deadline</span></p>
</div>
<button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #3fe0b5; color: #062a20; font: 500 14px Geist, system-ui, sans-serif; cursor: pointer">+ New project</button>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<label style="flex: 0 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid #24272c; border-radius: 8px; background: #121417; color: #8a8f98">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search projects</span>
<input type="search" placeholder="Search projects" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #e7e8ea; font: 400 14px Geist, system-ui, sans-serif">
</label>
<div role="group" aria-label="View" style="display: flex; padding: 3px; border: 1px solid #24272c; border-radius: 10px; background: #121417">
<span aria-current="true" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 7px; background: #1f2226; color: #f2f3f5">Cards</span>
<a href="Projects.dc.html" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 7px; color: #a7abb3; text-decoration: none">Table</a>
</div>
</div>

<div role="tablist" aria-label="Filter by phase" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid #24272c; border-radius: 10px; background: #121417; align-self: flex-start; max-width: 100%">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="10">
<button type="button" role="tab" aria-selected="{{t.selected}}" style="{{t.style}}">{{t.label}} <span style="color: #6f747c">{{t.count}}</span></button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="8">
<a href="#" style="{{p.cardStyle}}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
<span style="font-weight: 600; font-size: 16px; color: #f2f3f5">{{p.name}}</span>
<sc-if value="{{p.onHold}}" hint-placeholder-val="{{false}}"><span style="flex: none; font-size: 11px; font-weight: 500; color: #ffd7a1; background: #33260f; border-radius: 10px; padding: 2px 8px">On hold</span></sc-if>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #8a8f98">{{p.desc}}</span>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="font-weight: 500; color: #e7e8ea">{{p.phase}}</span><span style="font-family: 'Geist Mono', monospace; color: #8a8f98">{{p.step}}/7</span></div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{p.segs}}" as="s" hint-placeholder-count="7"><div style="{{s.style}}"></div></sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid #1c1f23">
<span style="{{p.deadlineStyle}}">{{p.deadlineText}}</span>
<div style="display: flex; align-items: center; gap: 10px">
<sc-if value="{{p.unread}}" hint-placeholder-val="{{false}}"><span aria-label="{{p.unreadLabel}}" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #3fe0b5; color: #062a20; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{p.unread}}</span></sc-if>
<div style="display: flex">
<sc-for list="{{p.team}}" as="m" hint-placeholder-count="2"><span aria-label="{{m.name}}" style="{{m.style}}">{{m.ini}}</span></sc-for>
</div>
</div>
</div>
</a>
</sc-for>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const PHASES = ['Idea','Planning','Design','Build','Test','Launch','Maintain'];
const people = {
AM: { name: 'Alex Morgan', bg: '#1b3a32', fg: '#8af0d3' },
SR: { name: 'Sara Rahman', bg: '#2b2442', fg: '#c9bfff' },
TK: { name: 'Tanvir Karim', bg: '#3a2a1a', fg: '#ffc98a' }
};
const raw = [
{ name: 'Fleet Tracker MVP', desc: 'Dispatcher dashboard with live vehicle positions and delivery exceptions.', phase: 'Build', deadline: 'Oct 8', late: true, onHold: true, team: ['AM'], unread: 0 },
{ name: 'Jajabor', desc: 'Travel planning app for domestic trips in Bangladesh.', phase: 'Build', deadline: 'Nov 30', team: ['AM','SR','TK'], unread: 2 },
{ name: 'Storefront Relaunch', desc: 'New product pages, checkout and a seasonal campaign page.', phase: 'Test', deadline: 'Oct 17', team: ['AM','SR'], unread: 0 },
{ name: 'Patient Portal v2', desc: 'Appointment booking, secure documents and a new sign-in flow.', phase: 'Launch', deadline: 'Oct 25', team: ['AM','SR'], unread: 1 },
{ name: 'Analytics Dashboard Redesign', desc: 'Information architecture, component library and high-fidelity designs.', phase: 'Design', deadline: 'Nov 7', team: ['SR'], unread: 0 },
{ name: 'Macrokite Website', desc: 'Our studio site: services, case studies and contact flow.', phase: 'Build', deadline: 'Nov 12', team: ['SR'], unread: 0 },
{ name: 'Subscription Billing Flow', desc: 'Pause and skip, a billing portal and payment reminder emails.', phase: 'Planning', deadline: 'Nov 27', team: ['AM','TK'], unread: 0 },
{ name: 'Website Migration', desc: 'Content moved and redirects live; now monitoring.', phase: 'Maintain', deadline: '', team: ['AM','SR'], unread: 0 }
];
const projects = raw.map((p) => {
const step = PHASES.indexOf(p.phase) + 1;
const segs = PHASES.map((_, i) => ({
style: 'height: 6px; border-radius: 3px; background: ' + (i < step - 1 ? (p.onHold ? '#5a5f66' : '#3fe0b5') : i === step - 1 ? (p.onHold ? '#8a8f98' : '#8af0d3') : '#24272c')
}));
return {
...p, step, segs,
cardStyle: 'display: flex; flex-direction: column; gap: 12px; min-height: 220px; box-sizing: border-box; padding: 20px; border-radius: 12px; background: #121417; text-decoration: none; color: inherit; border: 1px solid ' + (p.late ? '#4a2a25' : '#24272c'),
deadlineText: p.late ? 'Past deadline · ' + p.deadline : (p.deadline ? 'Due ' + p.deadline : 'No deadline'),
deadlineStyle: 'font-size: 13px; ' + (p.late ? 'color: #ff8f7a; font-weight: 500' : 'color: #a7abb3'),
unreadLabel: p.unread + ' unread messages in project chat',
team: p.team.map((k, i) => ({ ini: k, name: people[k].name, style: 'width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; border: 2px solid #121417; background: ' + people[k].bg + '; color: ' + people[k].fg + (i ? '; margin-left: -8px' : '') }))
};
});
const base = 'height: 36px; padding: 0 12px; border: 0; border-radius: 7px; font: 500 13px Geist, system-ui, sans-serif; cursor: pointer; ';
const tabs = [['All',8],['Idea',0],['Planning',1],['Design',1],['Build',3],['Test',1],['Launch',1],['Maintain',1],['On hold',1],['Archived',2]].map(([label, count], i) => ({
label, count, selected: i === 0 ? 'true' : 'false',
style: base + (i === 0 ? 'background: #1f2226; color: #f2f3f5' : 'background: transparent; color: #a7abb3') + (i === 8 ? '; margin-left: 10px' : '')
}));
return { projects, tabs };
}
}
</script>
</body>
</html>
