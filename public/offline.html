<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1014" />
    <title>Offline · Macrokite OS</title>
    <style>
      :root {
        --page: #0e1014;
        --fg: #e9ebf0;
        --muted: #9aa0ab;
        --accent: #f06a3f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --page: #e7e9ee;
          --fg: #14161b;
          --muted: #5c626d;
          --accent: #e8592f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50% 50% 50% 14%;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 20px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 8px 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 22px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">M</div>
      <h1>You’re offline</h1>
      <p>Macrokite OS needs a connection. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
